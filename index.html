<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Portafolio de Lucas Parra, estudiante de Informática."
    >

    <title>Lucas Parra | Portafolio</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Mis estilos -->
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>
    <a href="#contenido" class="saltar-contenido">
        Saltar al contenido
    </a>

    <div id="root">
        <p class="container py-5">
            Cargando portafolio…
            Si este mensaje permanece, revisa tu conexión a internet.
        </p>
    </div>

    <!-- React -->
    <script
        crossorigin
        src="https://unpkg.com/react@18.3.1/umd/react.development.js">
    </script>

    <script
        crossorigin
        src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js">
    </script>

    <!-- Permite escribir JSX directamente en estos archivos -->
    <script
        src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js">
    </script>

    <!-- El orden es importante: componentes primero, aplicación después -->
    <script
        type="text/babel"
        data-presets="react"
        src="./js/componentes.js">
    </script>

    <script
        type="text/babel"
        data-presets="react"
        src="./js/app.js">
    </script>
</body>
</html>
